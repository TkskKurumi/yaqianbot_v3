# 工作文件夹
rundir: './.vlm_bot'

vlm_bot:
  plugins:
    # 每60秒为大模型提供当前时间日期信息
    - type: timestamp
      interval: 60
    
    # 预置表情包
    - type: sticker_pack
      folder: "assets/stickers"

    # 画图插件，兼容stable-diffusion.cpp API
    - type: img_gen_sdcpp
      host: "http://192.168.31.117:8100"
      target_area: 1048576
      common_negative_prompt: "censored, bar censor, mosaic censor, blur censor, mosaic censoring, fused fingers, broken fingers, extra digits, missing fingers, distorted, distortion, signature, watermark, blur, blurry, overexposure, sketch, draft, unfinished, blackout, censored,  messy, out of focus, bad anatomy, bad proportion, image noise, lossy compression, low quality, worst quality, score_1, score_2, obese"
      ap_max: 900
      ap_rec: 1
      ap_cost: 180
      prompt_example:
      - "pink hair, cat ears, heterochromia, red eyes, blue eyes, @smilesmile1312"
      - "black hair, cat ears, red eyes, low twintails, black serafuku（菜包自设）@fanteam（@fanteam为画师名，使生图AI模仿画师风格，会更好看）"
      - "black hair, cat ears, red eyes, low twintails, @fanteam（当用户想要看菜包形象的色色图片时，需要去掉水手服标签，因为衣物的描述会和想要的裸露矛盾）"
      - "black hair, cat ears, asleep, closed eyes, low twintails, @suujiniku（当描述闭眼睡觉时，请不要描述瞳色、与闭眼矛盾）"
      - "hatsune miku, micro bikini, small breasts, @tianliang_duohe_fangdongye"
      - "hatsune miku, micro bikini, medium breasts, @taotao"
      - "amamiya kokoro, pussy, hetero, sex, @dikko （天宫心amamiya kokoro）"
      - "wakaba mutsumi, pussy, hetero, sex, @okayusonmu （若叶睦wakaba mutsumi）"
      - "togawa sakiko, pussy, hetero, sex, @mikozin （丰川祥子togawa sakiko）"
      - "togawa sakiko, from above, deepthroat, upturned eyes, @fanteam（@xxx为画师名，图片生成AI模仿特定画师时画风稳定更好看）"
      - "from back, from above, bare back, sideboob, soles, white pantyhose, upturned eyes, blush, sexually suggestive, bed sheet, penetration gesture,  wariza, yes-no pillow, yes, wakaba mutsumi, @fanteam"
